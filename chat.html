<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat with Jackson AI | Chemistry Education Portal</title>
<meta name="description" content="Ask Jackson AI any question, on any subject, and get an instant answer — built for Rwandan Senior 4-6 students.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Source+Serif+4:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Rich answer rendering: Markdown, LaTeX + chemistry equations (KaTeX/mhchem), diagrams (Mermaid) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.4/mermaid.min.js"></script>
<style>
  :root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--border:#30363d;--accent:#38bdf8;--gold:#e8c547;--green:#34d399;--red:#f87171;--text:#e6edf3;--muted:#8b949e;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.75;min-height:100vh;display:flex;flex-direction:column;}

  nav{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
  .nav-inner{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  .nav-brand{color:var(--text);text-decoration:none;font-weight:700;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:.9rem;}
  .nav-back{color:var(--accent);text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:.8rem;border:1px solid rgba(56,189,248,.3);padding:6px 12px;border-radius:20px;}
  .nav-back:hover{background:rgba(56,189,248,.1);}

  main{flex:1;max-width:800px;width:100%;margin:0 auto;padding:32px 20px 60px;display:flex;flex-direction:column;}

  .chat-hero{text-align:center;margin-bottom:24px;}

  .chat-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
  #new-chat-btn,#history-btn{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:7px 14px;border-radius:20px;font-size:.8rem;cursor:pointer;font-family:'JetBrains Mono',monospace;
  }
  #chat-word-btn,#chat-pdf-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:6px 12px;font-family:'JetBrains Mono',monospace;font-size:.75rem;cursor:pointer;}
  #chat-word-btn:hover,#chat-pdf-btn:hover{border-color:var(--accent);color:var(--accent);}
  #new-chat-btn:hover,#history-btn:hover{border-color:var(--accent);color:var(--accent);}
  .history-wrap{position:relative;}
  #history-panel{
    display:none;position:absolute;right:0;top:calc(100% + 6px);width:min(340px,88vw);max-height:65vh;overflow-y:auto;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:50;
  }
  #history-panel.open{display:block;}
  .history-item{
    display:flex;justify-content:space-between;align-items:center;gap:6px;
    padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:.82rem;
  }
  .history-item:last-child{border-bottom:none;}
  .history-item:hover{background:var(--surface2);}
  .history-item-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-item-date{font-size:.68rem;color:var(--muted);white-space:nowrap;margin-left:6px;}
  .history-item-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;flex-shrink:0;}
  .history-item-del:hover{color:var(--red);}
  .history-empty{padding:16px;text-align:center;color:var(--muted);font-size:.8rem;}
  .history-top{position:sticky;top:0;background:var(--surface);padding:8px;border-bottom:1px solid var(--border);z-index:2;display:flex;gap:6px;align-items:center;}
  .history-search{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 9px;font-size:.8rem;}
  .history-clear{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 8px;font-size:.7rem;cursor:pointer;white-space:nowrap;}
  .history-clear:hover{color:var(--red);border-color:var(--red);}
  .history-group{padding:6px 12px 3px;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--surface2);}
  .chat-hero h1{font-family:'Playfair Display',serif;font-size:2rem;color:#fff;margin-bottom:6px;}
  .chat-hero p{color:var(--muted);font-size:.92rem;}

  #chat-box{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;
    display:flex;flex-direction:column;overflow:hidden;min-height:60vh;
  }
  #chat-messages{
    flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;
  }
  .chat-msg{padding:10px 14px;border-radius:10px;max-width:80%;line-height:1.55;font-size:.95rem;}
  .chat-msg.user{align-self:flex-end;background:var(--accent);color:#0d1117;font-weight:500;}
  .chat-msg.bot{align-self:flex-start;background:var(--surface2);color:var(--text);border:1px solid var(--border);max-width:92%;}
  .chat-msg.bot.loading{color:var(--muted);font-style:italic;}
  .chat-msg.bot h1,.chat-msg.bot h2,.chat-msg.bot h3{font-family:'Playfair Display',serif;line-height:1.3;margin:.6em 0 .3em;}
  .chat-msg.bot h1{font-size:1.25rem;}
  .chat-msg.bot h2{font-size:1.12rem;}
  .chat-msg.bot h3{font-size:1.02rem;}
  .chat-msg.bot p{margin:.4em 0;}
  .chat-msg.bot ul,.chat-msg.bot ol{margin:.4em 0 .4em 1.3em;padding:0;}
  .chat-msg.bot li{margin:.2em 0;}
  .chat-msg.bot strong{color:var(--gold);}
  .chat-msg.bot code{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:.85em;}
  .chat-msg.bot pre{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;overflow-x:auto;margin:.5em 0;}
  .chat-msg.bot pre code{background:none;border:none;padding:0;}
  .chat-msg.bot table{border-collapse:collapse;margin:.5em 0;width:100%;font-size:.88rem;}
  .chat-msg.bot th,.chat-msg.bot td{border:1px solid var(--border);padding:5px 9px;text-align:left;}
  .chat-msg.bot th{background:var(--bg);color:var(--gold);}
  .chat-msg.bot blockquote{border-left:3px solid var(--accent);margin:.5em 0;padding:.2em .8em;color:var(--muted);}
  .chat-msg.bot a{color:var(--accent);}
  .chat-msg.bot .katex{font-size:1.02em;}
  .chat-msg.bot .katex-display{overflow-x:auto;overflow-y:hidden;margin:.5em 0;}


  .doc-msg{max-width:92%;}
  .doc-intro{margin:0 0 10px;}
  .doc-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .doc-icon{font-size:1.8rem;line-height:1;}
  .doc-info{flex:1;min-width:150px;}
  .doc-title{font-weight:600;color:var(--text);word-break:break-word;}
  .doc-sub{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-top:2px;}
  .doc-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .doc-btns button{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 13px;font-family:'JetBrains Mono',monospace;font-size:.75rem;cursor:pointer;}
  .doc-btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .doc-btns button:hover{opacity:.85;}
  .doc-preview{display:none;margin-top:12px;max-height:480px;overflow:auto;background:#e9edf2;border-radius:8px;padding:14px;}
  .doc-preview.open{display:block;}
  .doc-page{background:#fff;color:#000;font-family:Arial,sans-serif;font-size:11pt;line-height:1.5;padding:22px 26px;box-shadow:0 1px 6px rgba(0,0,0,.25);}
  .doc-page h1{font-size:1.3em;margin:0 0 .6em;} .doc-page h2{font-size:1.1em;margin:1em 0 .4em;}
  .doc-page table{border-collapse:collapse;} .doc-page td,.doc-page th{border:1px solid #444;padding:3px 7px;}
  .doc-page ol,.doc-page ul{padding-left:1.4em;}
  .msg-actions{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .msg-actions button{background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:16px;padding:4px 11px;font-family:'JetBrains Mono',monospace;font-size:.7rem;cursor:pointer;}
  .msg-actions button:hover{border-color:var(--accent);color:var(--accent);}
  .chat-msg.bot .svg-diagram{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px;margin:.5em 0;overflow-x:auto;text-align:center;}
  .chat-msg.bot .svg-diagram svg{width:100%;max-width:680px;height:auto;}
  .chat-msg.bot .mermaid{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;margin:.5em 0;overflow-x:auto;display:flex;justify-content:center;}

  #chat-input-row{display:flex;align-items:center;border-top:1px solid var(--border);padding:10px;gap:8px;}
  .chat-plus{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.15rem;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .chat-plus:hover{border-color:var(--accent);color:var(--accent);}
  #image-preview-row{padding:8px 14px 0;display:flex;align-items:center;gap:8px;}
  #image-preview-row img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
  #image-preview-remove{background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.8rem;line-height:1;}
  #image-preview-remove:hover{color:var(--red);border-color:var(--red);}
  #chat-input{
    flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);
    padding:12px 14px;font-size:.95rem;font-family:'Source Serif 4',Georgia,serif;outline:none;
  }
  #chat-input:focus{border-color:var(--accent);}
  #chat-send{
    background:var(--accent);color:#0d1117;border:none;border-radius:8px;padding:0 20px;
    font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.82rem;
  }
  #chat-send:hover{opacity:.9;}
  #chat-send:disabled{opacity:.5;cursor:not-allowed;}

  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:18px;border-top:1px solid var(--border);}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-brand" href="index.html">
      <img src="assets/profile.jpg" alt="Jackson Habimana" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">
      Jackson Habimana
    </a>
    <a class="nav-back" href="index.html">&larr; Back to Home</a>
  </div>
</nav>

<main>
  <div class="chat-hero">
    <h1>💬 Chat with Jackson AI</h1>
  </div>

  <div class="chat-toolbar">
    <button id="new-chat-btn" type="button">+ New Chat</button>
    <div class="history-wrap">
      <button id="history-btn" type="button">🕘 History</button>
      <div id="history-panel"></div>
    </div>
    <button id="chat-word-btn" type="button">📄 Chat → Word</button>
    <button id="chat-pdf-btn" type="button">📕 Chat → PDF</button>
  </div>

  <div id="chat-box">
    <div id="chat-messages">
      <div class="chat-msg bot" id="initial-greeting">Hi! 👋 What would you like to ask?</div>
    </div>
    <div id="image-preview-row" style="display:none;"></div>
    <div id="chat-input-row">
      <button class="chat-plus" id="chat-plus-btn" aria-label="Attach a photo or file" type="button">+</button>
      <input type="file" id="chat-file-input" accept="image/*,.pdf,.txt,application/pdf,text/plain" style="display:none;">
      <input id="chat-input" type="text" placeholder="Write a message..." autocomplete="off">
      <button id="chat-send">Send</button>
    </div>
  </div>
</main>

<footer>
  &#9883; Jackson Habimana &mdash; Chemistry Education Portal
</footer>

<script>
  const WORKER_URL = "https://chem-payment.hajackson2020.workers.dev/chat";
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });
  }
  const messages = document.getElementById('chat-messages');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');
  const plusBtn = document.getElementById('chat-plus-btn');
  const fileInput = document.getElementById('chat-file-input');
  const previewRow = document.getElementById('image-preview-row');

  let pendingImage = null; // { data: base64 (no prefix), mimeType, kind: 'image'|'pdf' }
  let pendingTextFile = null; // { name, content } for .txt attachments
  try { localStorage.removeItem('jai_name'); } catch (e) {} // names are no longer used

  const SESSIONS_KEY = 'jai_sessions';
  let currentSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  let currentMessages = []; // [{sender:'user'|'bot', kind:'text'|'bot-image', text, imageUrl, caption}]

  function getSessions() {
    try { return JSON.parse(localStorage.getItem(SESSIONS_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function saveSessions(arr) {
    try { localStorage.setItem(SESSIONS_KEY, JSON.stringify(arr)); return true; }
    catch (e) { return false; /* storage full or unavailable */ }
  }
  function persistCurrentSession() {
    if (!currentMessages.some(m => m.sender === 'user')) return; // nothing real to save yet
    const sessions = getSessions();
    const firstUserMsg = currentMessages.find(m => m.sender === 'user');
    const title = (firstUserMsg?.text || 'New chat').replace(/\s+/g, ' ').slice(0, 70);
    const idx = sessions.findIndex(s => s.id === currentSessionId);
    const record = { id: currentSessionId, title, updatedAt: Date.now(), messages: currentMessages };
    if (idx >= 0) sessions[idx] = record; else sessions.unshift(record);
    if (!saveSessions(sessions)) {
      // Browser storage is full: shrink the very long messages (e.g. pasted
      // files) instead of ever deleting old chats.
      const compact = sessions.map(sess => ({
        ...sess,
        messages: (sess.messages || []).map(m =>
          m.text && m.text.length > 4000 ? { ...m, text: m.text.slice(0, 4000) + ' …' } : m)
      }));
      saveSessions(compact);
    }
  }
  function relativeDate(ts) {
    const d = new Date(ts);
    const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' + time;
  }
  function historyGroupLabel(ts) {
    const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
    const dayMs = 86400000;
    const diffDays = Math.floor((startOfToday.getTime() - ts) / dayMs) + 1; // 0 = today
    if (ts >= startOfToday.getTime()) return 'Today';
    if (diffDays <= 1) return 'Yesterday';
    if (diffDays <= 7) return 'Previous 7 days';
    if (diffDays <= 30) return 'Previous 30 days';
    return new Date(ts).toLocaleDateString([], { month: 'long', year: 'numeric' });
  }
  function renderHistoryPanel(filter) {
    const panel = document.getElementById('history-panel');
    const keepSearch = document.getElementById('history-search');
    const q = (filter !== undefined ? filter : (keepSearch ? keepSearch.value : '')).trim().toLowerCase();
    const all = getSessions().sort((a, b) => b.updatedAt - a.updatedAt);
    panel.innerHTML = '';

    const top = document.createElement('div');
    top.className = 'history-top';
    const search = document.createElement('input');
    search.id = 'history-search';
    search.className = 'history-search';
    search.type = 'search';
    search.placeholder = 'Search your chats (' + all.length + ')';
    search.value = q;
    search.addEventListener('input', () => {
      renderHistoryPanel(search.value);
      const again = document.getElementById('history-search');
      again.focus(); again.setSelectionRange(again.value.length, again.value.length);
    });
    top.appendChild(search);
    if (all.length) {
      const clr = document.createElement('button');
      clr.type = 'button'; clr.className = 'history-clear'; clr.textContent = 'Clear all';
      clr.addEventListener('click', () => {
        if (confirm('Delete ALL your saved chats on this device? This cannot be undone.')) {
          saveSessions([]); renderHistoryPanel('');
        }
      });
      top.appendChild(clr);
    }
    panel.appendChild(top);

    const sessions = q
      ? all.filter(s => (s.title || '').toLowerCase().includes(q) ||
          (s.messages || []).some(m => (m.text || '').toLowerCase().includes(q)))
      : all;
    if (!sessions.length) {
      const empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = all.length ? 'No chats match your search' : 'No past chats yet';
      panel.appendChild(empty);
      return;
    }
    let lastLabel = null;
    sessions.forEach(s => {
      const label = historyGroupLabel(s.updatedAt);
      if (label !== lastLabel) {
        const g = document.createElement('div');
        g.className = 'history-group';
        g.textContent = label;
        panel.appendChild(g);
        lastLabel = label;
      }
      const item = document.createElement('div');
      item.className = 'history-item';
      const textSpan = document.createElement('span');
      textSpan.className = 'history-item-text';
      textSpan.textContent = s.title;
      const dateSpan = document.createElement('span');
      dateSpan.className = 'history-item-date';
      dateSpan.textContent = relativeDate(s.updatedAt);
      const delBtn = document.createElement('button');
      delBtn.className = 'history-item-del';
      delBtn.type = 'button';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        saveSessions(getSessions().filter(x => x.id !== s.id));
        renderHistoryPanel();
      });
      item.appendChild(textSpan);
      item.appendChild(dateSpan);
      item.appendChild(delBtn);
      item.addEventListener('click', () => loadSession(s.id));
      panel.appendChild(item);
    });
  }
  function loadSession(id) {
    persistCurrentSession();
    const session = getSessions().find(s => s.id === id);
    if (!session) return;
    currentSessionId = session.id;
    currentMessages = session.messages.slice();
    document.getElementById('chat-messages').innerHTML = '';
    session.messages.forEach(m => {
      if (m.kind === 'bot-image') {
        renderBotImage(m.imageUrl, m.caption);
      } else if (m.kind === 'doc') {
        renderDocCard({ title: m.title, html: m.html, fmt: m.fmt });
      } else {
        renderMessage(m.text, m.sender);
      }
    });
    document.getElementById('history-panel').classList.remove('open');
    document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
  }
  function startNewChat() {
    persistCurrentSession();
    currentSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    currentMessages = [];
    const messagesDiv = document.getElementById('chat-messages');
    messagesDiv.innerHTML = '';
    const greetDiv = document.createElement('div');
    greetDiv.className = 'chat-msg bot';
    greetDiv.textContent = "Hi! 👋 What would you like to ask?";
    messagesDiv.appendChild(greetDiv);
    clearPendingImage();
    document.getElementById('history-panel').classList.remove('open');
    input.value = '';
    input.focus();
  }

  document.getElementById('initial-greeting').textContent = "Hi! 👋 What would you like to ask?";

  // Render the AI's answer as rich content: Markdown (headers, bold, lists,
  // tables, code), LaTeX math and chemistry equations via KaTeX (including
  // the mhchem extension for reaction schemes, e.g. $\ce{2H2 + O2 -> 2H2O}$),
  // and diagrams/flowcharts via Mermaid (```mermaid code fences).
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // The AI doesn't always label SVG code as ```svg (it may say ```xml/```html,
  // use no fence at all, or get cut off before </svg>). Normalise all of those
  // so the figure is always drawn.
  function normalizeSvgBlocks(text) {
    const parts = text.split(/(```[\s\S]*?(?:```|$))/);
    return parts.map((part) => {
      if (part.startsWith('```')) {
        const inner = part.replace(/^```[^\n]*\n?/, '').replace(/```$/, '');
        const start = inner.search(/<svg[\s>]/i);
        if (start === -1) return part;
        let svg = inner.slice(start);
        const end = svg.toLowerCase().lastIndexOf('</svg>');
        svg = end === -1 ? svg + '\n</svg>' : svg.slice(0, end + 6);
        return '\n```svg\n' + svg + '\n```\n';
      }
      return part.replace(/<svg[\s\S]*?<\/svg>/gi, (m) => '\n```svg\n' + m + '\n```\n');
    }).join('');
  }

  function ensureSvgViewBox(code) {
    return code.replace(/<svg([^>]*)>/i, (m, attrs) => {
      if (/viewBox=/i.test(attrs)) return m;
      const w = attrs.match(/\bwidth=["']?(\d+)/i), h = attrs.match(/\bheight=["']?(\d+)/i);
      const vb = (w && h) ? `0 0 ${w[1]} ${h[1]}` : '0 0 600 400';
      return `<svg${attrs} viewBox="${vb}">`;
    });
  }

  function formatBotText(raw) {
    // 1. Pull out math segments first so Markdown parsing can't mangle
    // underscores/asterisks inside LaTeX. Restored after Markdown+sanitize.
    const mathStore = [];
    function stashMath(latex, display) {
      const idx = mathStore.length;
      mathStore.push({ latex, display });
      return `\uE000MATH${idx}\uE001`;
    }

  function printPdf(div, name) {

  // ── "Type it in Word / make a PDF" → document card with Download button ──
  function detectDocRequest(q) {
    let t = (q || '').toLowerCase();
    if (!t) return null;
    if (t.length > 600) t = t.slice(0, 300) + ' ' + t.slice(-300);
    t = t.replace(/word\s+(equations?|problems?|bank|count)/g, '');
    const word = /\b(docx|ms word|microsoft word|word\s+(document|file|doc))\b/.test(t) ||
                 /\b(in|into|to|as|on|using)\s+(a\s+)?word\b/.test(t) ||
                 /\b(make|create|generate)\s+(a|an|the)?\s*(document|doc)\b/.test(t);
    const pdf = /\bpdf\b/.test(t) && /\b(make|create|generate|type|put|convert|save|give|download|as|into|to|in)\b/.test(t);
    if (word) return 'word';
    if (pdf) return 'pdf';
    return null;
  }
  function parseDocHtml(raw) {
    let h = String(raw || '').trim().replace(/^```(?:html)?\s*/i, '').replace(/```\s*$/, '').trim();
    if (!/<\w+[^>]*>/.test(h)) return null;
    const d = new DOMParser().parseFromString('<div id="r">' + h + '</div>', 'text/html');
    const root = d.getElementById('r');
    root.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,img,svg,video,audio').forEach(n => n.remove());
    const keep = ['border', 'colspan', 'rowspan', 'align', 'cellpadding'];
    root.querySelectorAll('*').forEach(n => {
      Array.from(n.attributes).forEach(a => { if (!keep.includes(a.name.toLowerCase())) n.removeAttribute(a.name); });
    });
    const head = root.querySelector('h1,h2');
    const title = (head ? head.textContent : 'Document').trim().slice(0, 80) || 'Document';
    return { title, html: root.innerHTML };
  }
  function safeFileName(t) { return (t || 'document').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 60) || 'document'; }
  function renderDocCard(doc) {

    info.appendChild(ti); info.appendChild(sub);

    const dlWord = () => downloadWord(page, name);

  function addDocCard(doc) {

  function buildChatCopy() {

  // ── Streaming: show the answer while it is being written ──
  async function readAnswerStream(response, loadingMsg) {
    const reader = response.body.getReader();
    const dec = new TextDecoder();
    let buf = '', acc = '', live = null, lastPaint = 0, failed = null;
    const paint = (force) => {
      const now = Date.now();
      if (!force && now - lastPaint < 120) return;
      lastPaint = now;
      if (!live) { loadingMsg.remove(); live = document.createElement('div'); live.className = 'chat-msg bot'; messages.appendChild(live); }
      live.innerHTML = formatBotText(acc);
      messages.scrollTop = messages.scrollHeight;
    };
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
          if (!line.startsWith('data:')) continue;
          let o; try { o = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
          if (o.t) { acc += o.t; paint(false); }
          if (o.error) failed = o.error;
        }
      }
    } catch (e) { failed = e.message; }
    if (live) live.remove(); else loadingMsg.remove();
    if (acc.trim()) { addMessage(acc, 'bot'); return; } // final render: diagrams, formulas, buttons
    if (failed) console.error('Stream error:', failed);
    addMessage("Sorry, I couldn't get an answer right now. Please try again in a moment.", 'bot');
  }

  // ── Retry: write the last answer again ──
  function regenerateLast() {
    if (sendBtn.disabled) return;
    let k = currentMessages.length - 1;
    while (k >= 0 && !(currentMessages[k].sender === 'user' && currentMessages[k].kind === 'text' && !/^(📷|📄 Attached)/.test(currentMessages[k].text || ''))) k--;
    if (k < 0) return;
    const prev = currentMessages[k - 1];
    if (prev && prev.sender === 'user' && /^(📷|📄 Attached)/.test(prev.text || '')) { alert('That question had an attachment. Please attach it again and resend.'); return; }
    const q = currentMessages[k].text;
    currentMessages.length = k + 1;
    const nodes = Array.from(messages.children);
    for (let i = nodes.length - 1; i >= 0; i--) {
      if (nodes[i].classList.contains('user') && nodes[i].textContent === q) { nodes.slice(i + 1).forEach(n => n.remove()); break; }
    }
    persistCurrentSession();
    sendQuestion(q, true);
  }

    mk('📋 Copy', (b) => copyAnswer(text, b));

      div.querySelectorAll('.mermaid').forEach(async (node) => {

        try {
          await mermaid.parse(src);

          pre.appendChild(code);
          node.replaceWith(pre);
        }
        messages.scrollTop = messages.scrollHeight;

    if (sender === 'bot') addActionBar(div, text);

  // Resize/compress an image file client-side before sending, to keep
  // the request small and fast (max 1024px on the longest side).
  function fileToCompressedImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1024;
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          resolve(dataUrl);
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Read a PDF (or any binary file) as a base64 data URL, no compression.
  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Read a plain text file's actual text content.
  function fileToText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  async function sendQuestion(qOverride, isRetry) {
    const question = (qOverride !== undefined ? qOverride : input.value).trim();
    if (!question && !pendingImage && !pendingTextFile) return;

    if (pendingImage && pendingImage.kind === 'image') {
      addImageMessage('data:' + pendingImage.mimeType + ';base64,' + pendingImage.data);
    } else if (pendingImage && pendingImage.kind === 'pdf') {
      addMessage('📄 Attached a PDF', 'user');
    } else if (pendingTextFile) {
      addMessage('📄 Attached ' + pendingTextFile.name, 'user');
    }
    if (question && !isRetry) addMessage(question, 'user');

    if (!isRetry) input.value = '';
    const imageToSend = pendingImage;
    const textFileToSend = pendingTextFile;
    clearPendingImage();
    sendBtn.disabled = true;
    const loadingMsg = addMessage('Thinking...', 'bot loading');
    try {
      let messageText = question;
      if (textFileToSend) {
        messageText = `[Attached file: ${textFileToSend.name}]\n${textFileToSend.content}\n\n${question || 'Please read the attached file and help with it.'}`;
      }
      const docFmt = detectDocRequest(question);
      let lastBotText = '';
      for (let k = currentMessages.length - 1; k >= 0; k--) { const cm = currentMessages[k]; if (cm.sender === 'bot' && cm.kind === 'text' && cm.text && !cm.text.startsWith('Debug info')) { lastBotText = cm.text; break; } }
      let requestBody;
      if (docFmt) {
        const needsSource = !imageToSend && !textFileToSend && question.length < 200 && lastBotText;
        const sourceBlock = needsSource ? `\n\nContent to put in the document (from the previous answer):\n${lastBotText.slice(0, 8000)}` : '';
        requestBody = {
          docMode: true,
          prompt: `You are making a ${docFmt === 'pdf' ? 'PDF' : 'Word'} document for a Rwandan secondary-school teacher or student. Output ONLY the document body as clean HTML: no <html>, <head> or <body> tags, no Markdown, no code fences, no text before or after. Start with <h1>a short document title</h1>. Use <h2> for sections, <p>, <ol>/<ul>/<li>, and <table border="1"> for tables. Write superscripts and subscripts with <sup> and <sub> (examples: 1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup>, H<sub>2</sub>O, Fe<sup>3+</sup>, SO<sub>4</sub><sup>2-</sup>) and italics with <i>. Do not use LaTeX. Keep the original question numbers and put options (a), (b), (c), (d) on separate lines using <br>. Copy any attached picture or text faithfully and ignore watermarks. Do NOT add answers, explanations or extra questions unless the request asks for them.\n\nRequest: ${messageText || 'Put the attached content in a document.'}${sourceBlock}`
        };
      } else {
        // Conversation memory: send the recent turns (not the one just typed) so
        // follow-ups like "explain more" or "put that in Word" make sense.
        const hist = [];
        // drop "Thinking..." placeholders and the question we are sending right now
        let prior = currentMessages.filter(cm => cm.sender !== 'bot loading');
        const lastPrior = prior[prior.length - 1];
        if (lastPrior && lastPrior.sender === 'user' && lastPrior.text === question) prior = prior.slice(0, -1);
        for (const cm of prior) {
          if (cm.kind === 'doc') { hist.push({ role: 'model', text: '[I created a document: ' + cm.title + ']' }); continue; }
          if (cm.kind && cm.kind !== 'text') continue;
          if (!cm.text || cm.text.startsWith('Debug info') || cm.text.startsWith('Sorry,') || cm.text.startsWith('📷') || cm.text.startsWith('📄 Attached')) continue;
          const t = cm.text.replace(/```svg[\s\S]*?```/g, '[diagram]').replace(/```mermaid[\s\S]*?```/g, '[diagram]').slice(0, 3000);
          hist.push({ role: cm.sender === 'user' ? 'user' : 'model', text: t });
        }
        requestBody = { mode: 'tutor', prompt: messageText, history: hist.slice(-12), stream: true };
      }
      if (imageToSend) requestBody.image = imageToSend;

      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
      });
      if (response.ok && (response.headers.get('content-type') || '').includes('text/event-stream')) {
        await readAnswerStream(response, loadingMsg);
        return;
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        loadingMsg.remove();
        if (data.error) console.error('Chat error:', data.error);
        const showDebug = new URLSearchParams(location.search).has('debug');
        addMessage(data.message || (showDebug && data.error ? `Debug info: ${data.error}` : "Sorry, I couldn't get an answer right now. Please try again in a moment."), 'bot');
        return;
      }
      const answer = data.text || data.answer || data.response || "Sorry, I couldn't get an answer right now.";
      loadingMsg.remove();
      if (docFmt) {
        const doc = parseDocHtml(answer);
        if (doc) { doc.fmt = docFmt; addDocCard(doc); return; }
      }
      addMessage(answer, 'bot');
      if (Array.isArray(data.images) && data.images.length) {
        data.images.forEach(im => { if (im && im.url) addBotImage(im.url, im.caption); });
      } else if (data.image && data.image.url) {
        addBotImage(data.image.url, data.image.caption);
      }
    } catch (err) {
      loadingMsg.remove();
      addMessage("Sorry, something went wrong. Please try again.", 'bot');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;

    if (file.size > 10 * 1024 * 1024) {
      alert('That file is too large. Please choose one under 10MB.');
      clearPendingImage();
      return;
    }

    try {
      if (file.type.startsWith('image/')) {
        const dataUrl = await fileToCompressedImage(file);
        const [prefix, base64] = dataUrl.split(',');
        const mimeType = prefix.match(/data:(.*?);/)[1];
        pendingImage = { data: base64, mimeType, kind: 'image' };
        showPendingImagePreview(dataUrl);
      } else if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
        const dataUrl = await fileToDataUrl(file);
        const [prefix, base64] = dataUrl.split(',');
        pendingImage = { data: base64, mimeType: 'application/pdf', kind: 'pdf' };
        showPendingFileChip(file.name);
      } else if (file.type === 'text/plain' || file.name.toLowerCase().endsWith('.txt')) {
        const text = await fileToText(file);
        pendingTextFile = { name: file.name, content: text.slice(0, 15000) };
        showPendingFileChip(file.name);
      } else {
        alert('Please choose an image, a PDF, or a .txt file.');
        clearPendingImage();
        return;
      }
      input.focus();
    } catch (err) {
      alert('Could not process that file. Please try another.');
      clearPendingImage();
    }
  });

  document.getElementById('new-chat-btn').addEventListener('click', startNewChat);
  document.getElementById('history-btn').addEventListener('click', () => {
    const panel = document.getElementById('history-panel');
    const isOpening = !panel.classList.contains('open');
    if (isOpening) renderHistoryPanel();
    panel.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    const wrap = document.querySelector('.history-wrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('history-panel').classList.remove('open');
    }
  });

  document.getElementById('chat-word-btn').addEventListener('click', () => { if (!chatHasMessages()) return alert('Ask a question first.'); downloadWord(buildChatCopy()); });
  document.getElementById('chat-pdf-btn').addEventListener('click', () => { if (!chatHasMessages()) return alert('Ask a question first.'); downloadPdf(buildChatCopy()); });
  sendBtn.addEventListener('click', () => sendQuestion());
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendQuestion(); });

  // Auto-send a question passed in via ?q= from the homepage nav box.
  const params = new URLSearchParams(window.location.search);
  const incomingQ = params.get('q');
  if (incomingQ) {
    sendQuestion(incomingQ);
  } else {
    input.focus();
  }
</script>

</body>
</html>
